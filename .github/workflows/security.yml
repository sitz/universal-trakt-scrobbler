name: Security

on:
  pull_request:
    branches:
      - '**'
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      # Fail on high/critical advisories in production dependencies, except reviewed exceptions
      # documented in .github/scripts/check-audit.mjs. `|| true` keeps the non-zero audit exit
      # from stopping the step before the allowlist filter runs.
      - name: Audit production dependencies
        run: |
          pnpm audit --prod --json > audit.json || true
          node .github/scripts/check-audit.mjs
